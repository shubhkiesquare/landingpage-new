<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/ico" href="./images/kiesquare-favicon.ico" />
    <link rel="icon" type="image/png" href="./images/kiesquare-fav-icon.png" />
    <link rel="icon" type="image/png" href="./images/kiesquare-favicon-16x16.png" />
    <link rel="icon" type="image/png" href="./images/kiesquare-favicon-32x32.png" />
    <link rel="icon" type="image/png" href="./images/kiesquare-fav-192x192.png" />
    <link rel="icon" type="image/png" href="./images/kiesquare-fav-512x512.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet" />
    <title>KiE Verse</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/pricing.css" />
    <link rel="stylesheet" href="./css/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="container-fluid">
        <header id="header" class="pageheader">
            <div class="logo">
                <a href="./index.html">
                    <img src="./images/kieVerse-logo.png" alt="KiE Square" class="logo-img" />
                </a>
            </div>
        </header>
        <div class="main-content">
            <div class="row justify-content-center">
                <div class="col-6">
                    <div class="form-main-container">
                        <div class="form-ac-container" id="box">
                            <form action="" class="login-form-details" id="form1">
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">Client/Organization Description </label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">Name of the Organization</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">Company Website</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">
                                        Organization Category</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">Geography</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">Brands List</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">Brand Websites</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <button class="btn btn-primary" id="nextBtn">Next</button>
                            </form>
                            <form action="" class="login-form-details" id="form2">
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">Brands List
                                    </label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">Name of the Organization</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">Brand Category</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">
                                        Brand Sub Category</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="login-form-wrapper mb-3">
                                    <label for="" class="form-label">Tool Description</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="btn-container">
                                    <button class="btn btn-secondary" id="backBtn">Back</button>
                                    <button class="btn btn-primary">Submit</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>


    </div>

    <script src="./js/script.js"></script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const box = document.getElementById('box');
        const nextButton = document.getElementById('nextBtn');
        const backButton = document.getElementById('backBtn');

        // Rotate the box to show the second form
        nextButton.addEventListener('click', () => {
            box.style.transform = 'rotateY(180deg)';
        });

        // Rotate the box back to show the first form
        backButton.addEventListener('click', () => {
            box.style.transform = 'rotateY(0deg)';
        });
    </script>


</body>

</html>

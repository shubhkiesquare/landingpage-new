<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/ico" href="./images/kiesquare-favicon.ico" />
    <link rel="icon" type="image/png" href="./images/kiesquare-fav-icon.png" />
    <link rel="icon" type="image/png" href="./images/kiesquare-favicon-16x16.png" />
    <link rel="icon" type="image/png" href="./images/kiesquare-favicon-32x32.png" />
    <link rel="icon" type="image/png" href="./images/kiesquare-fav-192x192.png" />
    <link rel="icon" type="image/png" href="./images/kiesquare-fav-512x512.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title>KiE Verse</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async></script>
</head>

<body>
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col-12">
                <h3 class="d-block text-center mt-4">Onboarding Portal</h3>
                <div class="container" id="container">
                    <div class="form-container sign-up-container">
                        <form action="#">
                            <h1>For New Users</h1>

                            <span>Please fill out required details for registration </span>
                            <!-- <input type="text" placeholder="Name" /> -->
                            <input type="email" placeholder="Email" />
                            <input type="password" placeholder="Password" />
                            <button><a href="./login-details.html">Sign Up</a> </button>
                        </form>
                    </div>
                    <div class="form-container sign-in-container">
                        <form action="#">
                            <h1>Sign in</h1>

                            <input type="email" placeholder="Email" />
                            <input type="password" placeholder="Password" />
                            <small><a href="#">Forgot your password?</a></small>
                            <button><a href="./login-details.html">Sign In</a> </button>
                        </form>
                    </div>
                    <div class="overlay-container">
                        <div class="overlay">
                            <div class="overlay-panel overlay-left">
                                <h1>Welcome Back!</h1>
                                <!-- <p>
                                    To keep connected with us please login with your personal info
                                </p> -->
                                <button class="ghost" id="signIn">Sign In</button>
                            </div>
                            <div class="overlay-panel overlay-right">
                                <h1>Hello!</h1>
                                <p>Enter your personal details and start journey with us</p>
                                <button class="ghost" id="signUp">Sign Up</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/script.js"></script>
    <script src="./js/login.js"></script>
</body>

</html>
